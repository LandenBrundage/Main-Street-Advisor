name: Verify website

on:
  push:
    branches: [main, release/landing-first-login]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium
      - name: Verify workspace and onboarding in the browser
        run: npm run test:e2e -- --workers=1
        env:
          ENABLE_DEMO_MODE: "true"
          ENABLE_DEMO_AI: "false"
